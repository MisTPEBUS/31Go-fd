<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
        三鶯 GO｜活動管理中心
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="
    bg-[#F3F4F6]
    text-slate-800
">

    <!-- Header -->

    <header class="
        sticky
        top-0
        z-50
        bg-white/90
        backdrop-blur
        border-b
        border-slate-200
    ">

        <div class="
            max-w-7xl
            mx-auto
            px-6
            py-4
            flex
            items-center
            justify-between
        ">

            <div>

                <div class="
                    text-xs
                    tracking-[0.25em]
                    text-[#4FA3D9]
                    font-bold
                ">
                    SAN-YING GO
                </div>

                <h1 class="
                    text-2xl
                    font-black
                ">
                    活動管理中心
                </h1>

            </div>

            <div class="text-right">

                <div class="
                    text-sm
                    font-bold
                    text-red-600
                ">
                    管理者
                </div>

                <div class="
                    text-xs
                    text-slate-500
                ">
                    2026/06/04
                </div>

            </div>

        </div>

    </header>

    <!-- Main -->

    <main class="
        max-w-7xl
        mx-auto
        p-6
        space-y-6
    ">

        <!-- Dashboard -->

        <section class="
            grid
            grid-cols-2
            lg:grid-cols-4
            gap-4
        ">

            <div class="
                bg-white
                rounded-3xl
                p-5
                shadow-sm
            ">
                <div class="text-slate-500 text-sm">
                    今日註冊
                </div>

                <div class="
                    mt-2
                    text-4xl
                    font-black
                    text-[#2C6E9B]
                ">
                    82
                </div>
            </div>

            <div class="
                bg-white
                rounded-3xl
                p-5
                shadow-sm
            ">
                <div class="text-slate-500 text-sm">
                    今日打卡
                </div>

                <div class="
                    mt-2
                    text-4xl
                    font-black
                    text-[#2C6E9B]
                ">
                    248
                </div>
            </div>

            <div class="
                bg-white
                rounded-3xl
                p-5
                shadow-sm
            ">
                <div class="text-slate-500 text-sm">
                    今日領獎
                </div>

                <div class="
                    mt-2
                    text-4xl
                    font-black
                    text-emerald-600
                ">
                    35
                </div>
            </div>

            <div class="
                bg-white
                rounded-3xl
                p-5
                shadow-sm
            ">
                <div class="text-slate-500 text-sm">
                    待領獎
                </div>

                <div class="
                    mt-2
                    text-4xl
                    font-black
                    text-[#F28C28]
                ">
                    18
                </div>
            </div>

        </section>

        <!-- Content -->

        <div class="
            grid
            lg:grid-cols-2
            gap-6
        ">

            <!-- A -->

            <section class="
                bg-white
                rounded-[32px]
                p-6
                shadow-sm
            ">

                <div class="
                    flex
                    justify-between
                    items-center
                    mb-6
                ">

                    <h2 class="
                        text-xl
                        font-black
                    ">
                        活動打卡地點
                    </h2>

                    <span class="
                        text-xs
                        tracking-[0.2em]
                        text-slate-400
                    ">
                        SPOTS
                    </span>

                </div>

                <div class="
                    flex
                    gap-3
                    mb-6
                ">

                    <input type="text" placeholder="輸入景點名稱" class="
                            flex-1
                            h-12
                            rounded-xl
                            border
                            px-4
                        " />

                    <button class="
                        px-5
                        rounded-xl
                        bg-[#4FA3D9]
                        text-white
                        font-bold
                    ">
                        新增
                    </button>

                </div>

                <div class="space-y-4">

                    <div class="
                        border
                        rounded-2xl
                        p-4
                    ">

                        <h3 class="
                            font-bold
                            mb-3
                        ">
                            鶯歌陶瓷博物館
                        </h3>

                        <div class="
                            h-28
                            w-28
                            bg-slate-100
                            rounded-xl
                            flex
                            items-center
                            justify-center
                            mx-auto
                        ">
                            QR
                        </div>

                        <div class="
                            mt-4
                            text-xs
                            bg-slate-50
                            p-3
                            rounded-xl
                            break-all
                        ">
                            spotId=123
                        </div>

                        <button class="
                            mt-3
                            w-full
                            h-10
                            rounded-xl
                            bg-slate-800
                            text-white
                        ">
                            複製網址
                        </button>

                    </div>

                </div>

            </section>

            <!-- B -->

            <section class="
                bg-white
                rounded-[32px]
                p-6
                shadow-sm
            ">

                <h2 class="
                    text-xl
                    font-black
                    mb-6

                    會員查詢
                </h2>

                <div class="
                    flex
                    gap-3
                    mb-6
                ">

                    <input placeholder="活動碼" class="
                            flex-1
                            h-12
                            border
                            rounded-xl
                            px-4
                        " />

                    <button class="
                        px-5
                        rounded-xl
                        bg-[#4FA3D9]
                        text-white
                    ">
                        查詢
                    </button>

                </div>

                <div class="
                    border
                    rounded-2xl
                    p-4
                ">

                    <div class="font-bold">
                        王小明
                    </div>

                    <div class="
                        text-sm
                        text-slate-500
                        mt-1
                    ">
                        U123456789
                    </div>

                    <div class="
                        mt-4
                        text-sm
                    ">
                        活動碼：47517368
                    </div>

                    <select class="
                        mt-4
                        w-full
                        h-12
                        border
                        rounded-xl
                        px-3
                    ">
                        <option>
                            一般旅客
                        </option>

                        <option>
                            核銷人員
                        </option>

                        <option>
                            管理者
                        </option>
                    </select>

                </div>

            </section>

            <!-- C -->

            <section class="
                bg-white
                rounded-[32px]
                p-6
                shadow-sm
            ">

                <h2 class="
                    text-xl
                    font-black
                    mb-6
                ">
                    活動查詢
                </h2>

                <div class="
                    flex
                    gap-3
                    mb-6
                ">

                    <input placeholder="PO-6201203571" class="
                            flex-1
                            h-12
                            border
                            rounded-xl
                            px-4
                        " />

                    <button class="
                        px-5
                        rounded-xl
                        bg-[#4FA3D9]
                        text-white
                    ">
                        查詢
                    </button>

                </div>

                <div class="
                    rounded-2xl
                    bg-[#FFF8F0]
                    p-4
                ">

                    <div class="
                        flex
                        justify-between
                        mb-4
                    ">

                        <div class="font-bold">
                            活動中
                        </div>

                        <div>
                            3 / 5
                        </div>

                    </div>

                    <div class="space-y-2">

                        <div>
                            ✓ 鶯歌陶瓷博物館
                        </div>

                        <div>
                            ✓ 新北市美術館
                        </div>

                        <div>
                            ✓ 客家文化園區
                        </div>

                        <div>
                            ○ 三峽老街
                        </div>

                        <div>
                            ○ 鳶山
                        </div>

                    </div>

                    <button class="
                        mt-5
                        w-full
                        h-12
                        rounded-xl
                        bg-red-500
                        text-white
                        font-bold
                    ">
                        刪除活動
                    </button>

                </div>

            </section>

            <!-- D -->

            <section class="
                bg-white
                rounded-[32px]
                p-6
                shadow-sm

                <h2 class="
                    text-xl
                    font-black
                    mb-6

                    今日兌換狀態
                </h2>

                <div class="space-y-3">

                    <div class="
                        flex
                        justify-between
                        items-center
                        p-4
                        rounded-2xl
                        bg-slate-50
                    ">
                        <div>
                            PO-6201203571
                        </div>

                        <span class="
                            px-3
                            py-1
                            rounded-full
                            bg-emerald-100
                            text-emerald-700
                            text-sm
                        ">
                            已核銷
                        </span>
                    </div>

                    <div class="
                        flex
                        justify-between
                        items-center
                        p-4
                        rounded-2xl
                        bg-slate-50
                    ">
                        <div>
                            PO-6201203588
                        </div>

                        <span class="
                            px-3
                            py-1
                            rounded-full
                            bg-emerald-100
                            text-emerald-700
                            text-sm
                        ">
                            已核銷
                        </span>
                    </div>

                    <div class="
                        flex
                        justify-between
                        items-center
                        p-4
                        rounded-2xl
                        bg-slate-50
                    ">
                        <div>
                            PO-6201203599
                        </div>

                        <span class="
                            px-3
                            py-1
                            rounded-full
                            bg-emerald-100
                            text-emerald-700
                            text-sm
                        ">
                            已核銷
                        </span>
                    </div>

                </div>

            </section>

        </div>

    </main>

    <nav class="
    fixed
    bottom-0
    left-0
    right-0
    z-50
    bg-white/95
    backdrop-blur-xl
    border-t
    border-slate-200
    shadow-[0_-10px_30px_rgba(0,0,0,0.05)]
">

        <div class="
        max-w-7xl
        mx-auto
        h-16
        flex
        items-center
        justify-center
    ">

            <button id="redeemBtn" class="
            flex
            items-center
            gap-2
            px-8
            py-3
            rounded-2xl
            bg-[#F28C28]
            text-white
            font-bold
            shadow-lg
            active:scale-95
            transition
        ">



                <span>
                    核銷
                </span>

            </button>

        </div>

    </nav>
    <script type="module" src="../../assets/js//admin-dashboard.js">
    </script>
