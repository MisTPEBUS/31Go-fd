<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1
        ">

    <title>
        打卡核銷
    </title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="
    min-h-screen
    bg-gradient-to-b
    from-[#F8FBFD]
    via-[#F3F7FA]
    to-[#EDF3F7]
">

    <!-- Glow -->

    <div class="
        fixed
        top-[-120px]
        right-[-80px]
        w-[320px]
        h-[320px]
        rounded-full
        bg-sky-200/40
        blur-3xl
    ">
    </div>

    <div class="
        fixed
        bottom-[-100px]
        left-[-80px]
        w-[260px]
        h-[260px]
        rounded-full
        bg-cyan-200/30
        blur-3xl
    ">
    </div>

    <div class="
        relative
        z-10
        max-w-md
        mx-auto
        px-5
        py-6
        pb-24
    ">

        <!-- Header -->

        <div class="
            bg-white/80
            backdrop-blur-xl
            border
            border-white/70
            rounded-[36px]
            p-6
            shadow-[0_20px_60px_rgba(44,110,155,0.12)]
        ">

            <div class="
                flex
                items-center
                gap-4
            ">

                <div class="
                    w-16
                    h-16
                    rounded-3xl
                    bg-gradient-to-br
                    from-[#4FA3D9]
                    to-[#2C6E9B]
                    text-white
                    flex
                    items-center
                    justify-center
                    font-black
                    text-xl
                ">
                    QR
                </div>

                <div>

                    <div class="
                        text-xs
                        tracking-[0.2em]
                        text-slate-400
                    ">
                        CHECK-IN REDEEM
                    </div>

                    <h1 class="
                        text-2xl
                        font-black
                        text-slate-800
                    ">
                        打卡核銷
                    </h1>

                </div>

            </div>

        </div>

        <!-- Guide -->

        <div class="
            mt-5
            bg-white
            rounded-[32px]
            p-6
            border
            border-slate-100
            shadow-sm
        ">

            <h2 class="
                text-lg
                font-black
                text-slate-800
            ">
                使用說明
            </h2>

            <div class="
                mt-5
                space-y-4
                text-sm
            ">

                <div class="flex gap-4">

                    <div class="
                        text-[#4FA3D9]
                        font-black
                    ">
                        01
                    </div>

                    <div>
                        點擊開始掃描
                    </div>

                </div>

                <div class="flex gap-4">

                    <div class="
                        text-[#4FA3D9]
                        font-black
                    ">
                        02
                    </div>

                    <div>
                        掃描會員 QRCode
                    </div>

                </div>

                <div class="flex gap-4">

                    <div class="
                        text-[#4FA3D9]
                        font-black
                    ">
                        03
                    </div>

                    <div>
                        LINE 驗證後完成核銷
                    </div>

                </div>

            </div>

        </div>

        <!-- Scan -->

        <button id="startScanBtn" class="
                mt-5
                w-full
                h-16
                rounded-[28px]
                bg-gradient-to-r
                from-[#4FA3D9]
                to-[#2C6E9B]
                text-white
                font-black
                text-lg
                shadow-lg
            ">
            開始掃描
        </button>

        <!-- Result -->

        <div class="
            mt-5
            bg-white
            rounded-[32px]
            p-6
            border
            border-slate-100
            shadow-sm
        ">

            <div class="
                text-xs
                tracking-[0.2em]
                text-slate-400
            ">
                SCAN RESULT
            </div>

            <div id="scanResult" class="
                    mt-4
                    text-lg
                    font-bold
                    text-slate-700
                ">
                尚未掃描
            </div>

        </div>

        <!-- Scanner -->

        <div id="scanner" class="
                hidden
                mt-5
                overflow-hidden
                rounded-[32px]
                border
                border-slate-200
                bg-black
            ">
        </div>

    </div>

    <!-- Loading Modal -->

    <div id="loadingModal" class="
            hidden
            fixed
            inset-0
            z-50
            bg-black/50
            flex
            items-center
            justify-center
            p-5
        ">

        <div class="
            w-full
            max-w-sm
            bg-white
            rounded-[36px]
            p-8
            text-center
        ">

            <div class="
                w-16
                h-16
                border-4
                border-slate-200
                border-t-[#2C6E9B]
                rounded-full
                animate-spin
                mx-auto
            ">
            </div>

            <h2 class="
                mt-6
                text-2xl
                font-black
            ">
                驗證中
            </h2>

            <p class="
                mt-3
                text-slate-500
            ">
                正在發送驗證碼至 LINE
            </p>

        </div>

    </div>

    <!-- OTP Modal -->

    <div id="otpModal" class="
            hidden
            fixed
            inset-0
            z-50
            bg-black/50
            flex
            items-center
            justify-center
            p-5
        ">

        <div class="
            w-full
            max-w-sm
            bg-white
            rounded-[36px]
            p-8
        ">

            <div class="text-center">

                <div class="
                    w-20
                    h-20
                    rounded-full
                    bg-[#E6F2FB]
                    flex
                    items-center
                    justify-center
                    mx-auto
                ">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-[#2C6E9B]" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8" />

                    </svg>

                </div>

                <h2 class="
                    mt-6
                    text-2xl
                    font-black
                ">
                    驗證登入
                </h2>

                <p class="
                    mt-3
                    text-slate-500
                ">
                    驗證碼已傳送至 LINE
                </p>

                <div id="countdown" class="
                        mt-4
                        text-xl
                        font-black
                        text-[#F28C28]
                    ">
                    05:00
                </div>

            </div>

            <div class="
                mt-8
                flex
                justify-center
                gap-3
            ">

                <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-2xl font-black">

                <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-2xl font-black">

                <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-2xl font-black">

                <input maxlength="1" class="otp w-14 h-14 rounded-2xl border text-center text-2xl font-black">

            </div>

            <button id="verifyBtn" class="
                    mt-8
                    w-full
                    h-14
                    rounded-2xl
                    bg-gradient-to-r
                    from-[#4FA3D9]
                    to-[#2C6E9B]
                    text-white
                    font-bold
                ">
                驗證登入
            </button>

        </div>

    </div>

    <!-- Compare Result -->

    <div id="resultModal" class="
            hidden
            fixed
            inset-0
            z-50
            bg-black/50
            flex
            items-center
            justify-center
            p-5
        ">

        <div class="
            w-full
            max-w-sm
            bg-white
            rounded-[36px]
            p-8
        ">

            <div class="
                text-center
            ">

                <div id="resultIcon" class="
                        w-24
                        h-24
                        rounded-full
                        bg-emerald-50
                        border
                        border-emerald-100
                        flex
                        items-center
                        justify-center
                        mx-auto
                    ">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-emerald-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />

                    </svg>

                </div>

                <h2 id="resultTitle" class="
                        mt-6
                        text-3xl
                        font-black
                    ">
                    核銷成功
                </h2>

                <p id="resultMessage" class="
                        mt-4
                        text-slate-500
                        leading-7
                    ">
                </p>

                <button id="closeResultBtn" class="
                        mt-8
                        w-full
                        h-12
                        rounded-2xl
                        bg-[#2C6E9B]
                        text-white
                        font-bold
                    ">
                    確定
                </button>

            </div>

        </div>

    </div>

    <script type="module" src="../../../assets/js/redeem.js">
    </script>

</body>

</html>
