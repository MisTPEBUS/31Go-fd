<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>打卡地點｜三鶯 GO 活動管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: { 500: '#4FA3D9', 700: '#2C6E9B' }, warning: { 500: '#F28C28' } },
                    borderRadius: { soft: '24px', card: '36px', logo: '32px' },
                    boxShadow: { card: '0 20px 60px rgba(44,110,155,.12)' }
                }
            }
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="assets/css/app.css" />
</head>

<body data-page="spots" class="min-h-screen bg-gradient-to-b from-[#F8FBFD] via-[#F3F7FA] to-[#EDF3F7] text-slate-800">
    <div class="pointer-events-none fixed right-[-120px] top-[-120px] h-80 w-80 rounded-full bg-sky-200/40 blur-3xl">
    </div>
    <div class="pointer-events-none fixed bottom-[-120px] left-[-120px] h-80 w-80 rounded-full bg-cyan-200/30 blur-3xl">
    </div>

    <div class="relative mx-auto flex min-h-screen w-full max-w-[1440px] flex-col lg:flex-row">
        <aside id="sidebar"
            class="no-print fixed inset-y-0 left-0 z-40 w-[290px] -translate-x-full border-r border-white/70 bg-white/80 p-5 shadow-card backdrop-blur-xl transition lg:sticky lg:top-0 lg:h-screen lg:translate-x-0">
            <div class="mb-8 flex items-center gap-3">
                <div
                    class="primary-gradient flex h-14 w-14 items-center justify-center rounded-logo text-xl font-black text-white">
                    GO</div>
                <div>
                    <p class="text-xs font-black tracking-[.28em] text-primary-700">SAN-YING GO</p>
                    <h1 class="text-xl font-black text-slate-800">活動管理中心</h1>
                </div>
            </div>
            <nav class="space-y-2" aria-label="管理選單"><a href="index.html" data-page="dashboard"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">本日狀態</a>
                <a href="spots.html" data-page="spots"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">打卡地點</a>
                <a href="verify.html" data-page="verify"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">打卡核銷</a>
                <a href="members.html" data-page="members"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">會員管理</a>
                <a href="import-orders.html" data-page="import"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">訂單匯入</a>
                <a href="orders.html" data-page="orders"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">訂單查詢</a>
                <a href="reports.html" data-page="reports"
                    class="nav-link flex w-full items-center rounded-[24px] px-4 py-4 text-sm font-bold text-slate-600 transition hover:bg-sky-100">下載報表</a>
            </nav>

        </aside>

        <div id="sidebarBackdrop" class="no-print fixed inset-0 z-30 hidden bg-slate-900/30 backdrop-blur-sm lg:hidden">
        </div>

        <main class="flex-1 p-4 sm:p-6 lg:p-8">
            <header
                class="no-print glass-card sticky top-3 z-20 mb-6 flex items-center justify-between rounded-card px-4 py-4 sm:px-6">
                <div class="flex items-center gap-3">
                    <button id="openSidebarBtn"
                        class="flex h-12 w-12 items-center justify-center rounded-soft bg-slate-50 text-slate-700 lg:hidden"
                        aria-label="開啟選單">☰</button>
                    <div>
                        <p class="text-xs font-black tracking-[.3em] text-primary-700">ACTIVITY ADMIN</p>
                        <h2 class="text-xl font-black sm:text-2xl">打卡地點</h2>
                    </div>
                </div>

            </header>


            <section class="grid gap-6 xl:grid-cols-[420px_1fr]">
                <form id="spotForm" class="glass-card rounded-card p-5 sm:p-7">
                    <input type="hidden" name="id" />

                    <p class="text-xs font-black tracking-[.3em] text-primary-700">CHECK-IN SPOT</p>
                    <h3 id="spotFormTitle" class="mt-2 text-2xl font-black">新增打卡地點</h3>

                    <div class="mt-6 space-y-4">
                        <label class="block">
                            <span class="mb-2 block text-sm font-medium text-slate-600">地點名稱</span>
                            <input name="name" required
                                class="h-14 w-full rounded-soft border border-slate-200 bg-slate-50 px-5 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-blue-100" />
                        </label>

                        <label class="block">
                            <span class="mb-2 block text-sm font-medium text-slate-600">描述</span>
                            <textarea name="description" rows="4"
                                class="w-full rounded-soft border border-slate-200 bg-slate-50 px-5 py-4 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-blue-100"></textarea>
                        </label>

                        <label class="block">
                            <span class="mb-2 block text-sm font-medium text-slate-600">地址</span>
                            <input name="address"
                                class="h-14 w-full rounded-soft border border-slate-200 bg-slate-50 px-5 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-blue-100" />
                        </label>

                        <input name="qrcodeToken" type="hidden" />
                        <input name="imageUrl" type="hidden" />

                        <label class="block">
                            <span class="mb-2 block text-sm font-medium text-slate-600">排序</span>
                            <input name="sortOrder" type="number" min="0" value="0"
                                class="h-14 w-full rounded-soft border border-slate-200 bg-slate-50 px-5 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-blue-100" />
                        </label>

                        <label class="flex items-center gap-3 rounded-soft bg-slate-50 px-5 py-4">
                            <input name="isEnabled" type="checkbox" checked class="h-5 w-5 rounded border-slate-300" />
                            <span class="text-sm font-bold text-slate-600">啟用</span>
                        </label>

                        <div class="grid grid-cols-2 gap-3">
                            <button id="resetSpotFormBtn" type="button"
                                class="h-14 rounded-soft border border-slate-200 bg-white font-black text-primary-700">
                                清空
                            </button>
                            <button id="submitSpotBtn" type="submit"
                                class="primary-gradient h-14 rounded-soft font-black text-white shadow-lg">
                                新增地點
                            </button>
                        </div>
                    </div>
                </form>
                <div class="glass-card rounded-card p-5 sm:p-7">
                    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
                        <div>
                            <p class="text-xs font-black tracking-[.3em] text-primary-700">SPOT LIST</p>
                            <h3 class="mt-2 text-2xl font-black">查詢地點</h3>
                        </div>
                        <label class="block sm:w-80"><span
                                class="mb-2 block text-sm font-medium text-slate-600">關鍵字</span><input id="spotSearch"
                                class="h-14 w-full rounded-soft border border-slate-200 bg-slate-50 px-5 outline-none transition focus:border-primary-500 focus:ring-4 focus:ring-blue-100"
                                placeholder="輸入名稱或代碼" /></label>
                    </div>
                    <div id="spotList" class="mt-6 grid grid-cols-1 gap-4"></div>
                </div>
            </section>

        </main>
    </div>

    <div id="appModal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/35 p-4 backdrop-blur-sm">
        <div class="glass-card w-full max-w-sm rounded-card p-8 text-center">
            <div id="modalIcon"
                class="mx-auto flex h-16 w-16 items-center justify-center rounded-full text-2xl font-black"></div>
            <h3 id="modalTitle" class="mt-5 text-2xl font-black"></h3>
            <p id="modalMessage" class="mt-3 text-sm leading-6 text-slate-500"></p>
            <button id="modalCloseBtn"
                class="primary-gradient mt-6 h-14 w-full rounded-soft font-black text-white shadow-lg">知道了</button>
        </div>
    </div>

    <div id="appToast"
        class="fixed bottom-5 left-1/2 z-50 -translate-x-1/2 translate-y-6 rounded-full bg-slate-900 px-5 py-3 text-sm font-bold text-white opacity-0 shadow-lg transition no-print">
    </div>

    <script src="assets/js/common.js"></script>
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/spots.js"></script>
</body>

</html>
