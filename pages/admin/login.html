<!DOCTYPE html>
<html lang="zh-Hant">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        三鶯 GO｜管理中心登入
    </title>


    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="
    min-h-screen
    bg-gradient-to-b
    from-[#F8FBFD]
    via-[#F3F7FA]
    to-[#EDF3F7]
">

    <!-- Glow -->

    <div class="
        fixed
        top-[-120px]
        right-[-80px]
        w-[320px]
        h-[320px]
        rounded-full
        bg-sky-200/40
        blur-3xl
    ">
    </div>

    <div class="
        fixed
        bottom-[-100px]
        left-[-80px]
        w-[260px]
        h-[260px]
        rounded-full
        bg-cyan-200/30
        blur-3xl
    ">
    </div>

    <div class="
        relative
        z-10
        min-h-screen
        flex
        items-center
        justify-center
        p-5
    ">

        <div class="
            w-full
            max-w-md
        ">

            <!-- Logo -->

            <div class="
                text-center
                mb-6
            ">

                <div class="
                hidden
                    inline-flex
                    items-center
                    justify-center
                    w-24
                    h-24
                    rounded-[32px]
                    bg-gradient-to-br
                    from-[#4FA3D9]
                    to-[#2C6E9B]
                    text-white
                    text-4xl
                    font-black
                    shadow-[0_20px_40px_rgba(44,110,155,0.25)]
                ">
                    GO
                </div>

                <div class="
                    mt-5
                    text-xs
                    tracking-[0.35em]
                    text-[#4FA3D9]
                    font-bold
                ">
                    SAN-YING GO
                </div>

                <h1 class="
                    mt-2
                    text-3xl
                    font-black
                    text-slate-800
                ">
                    活動管理中心
                </h1>

                <p class="
                    mt-3
                    text-slate-500
                ">
                    管理者 / 核銷人員登入
                </p>

            </div>

            <div class="space-y-6">

                <!-- Step1 -->

                <div id="loginStep1" class="
            bg-white/80
            backdrop-blur-xl
            border
            border-white/70
            rounded-[36px]
            p-8
            shadow-[0_20px_60px_rgba(44,110,155,0.12)]
        ">

                    <div class="
            text-xs
            tracking-[0.2em]
            text-slate-400
            mb-2
        ">
                        ACTIVITY CODE
                    </div>

                    <label class="
            text-sm
            font-medium
            text-slate-600
        ">
                        活動碼
                    </label>

                    <input id="activityCode" type="number" placeholder="請輸入活動碼" class="
                mt-2
                w-full
                h-14
                rounded-2xl
                border
                border-slate-200
                bg-slate-50
                px-4
                text-center
                text-lg
                font-black
                tracking-[0.15em]
                outline-none
                focus:border-[#4FA3D9]
                focus:ring-4
                focus:ring-sky-100
            ">

                    <button id="sendCodeBtn" class="
                mt-6
                w-full
                h-14
                rounded-2xl
                bg-gradient-to-r
                from-[#4FA3D9]
                to-[#2C6E9B]
                text-white
                font-bold
                shadow-lg
            ">
                        取得驗證碼
                    </button>

                </div>

                <!-- Step2 -->

                <div id="loginStep2" class="
            hidden
            bg-white/80
            backdrop-blur-xl
            border
            border-white/70
            rounded-[36px]
            p-8
            shadow-[0_20px_60px_rgba(44,110,155,0.12)]
        ">

                    <div class="text-center">

                        <div class="
                w-20
                h-20
                rounded-full
                bg-[#E6F2FB]
                flex
                items-center
                justify-center
                mx-auto
            ">

                            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-[#2C6E9B]" fill="none"
                                viewBox="0 0 24 24" stroke="currentColor">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8" />

                            </svg>

                        </div>

                        <h2 class="
                mt-6
                text-2xl
                font-black
                text-slate-800
            ">
                            驗證登入
                        </h2>

                        <p class="
                mt-3
                text-slate-500
            ">
                            驗證碼已經傳送到 LINE
                        </p>

                        <div id="countdown" class="
                    mt-4
                    text-xl
                    font-black
                    text-[#F28C28]
                ">
                            05:00
                        </div>

                    </div>

                    <!-- OTP -->

                    <div class="
            mt-8
            flex
            justify-center
            gap-3
        ">

                        <input maxlength="1" class="
                    otp
                    w-14
                    h-14
                    rounded-2xl
                    border
                    border-slate-200
                    bg-slate-50
                    text-center
                    text-2xl
                    font-black
                    outline-none
                    focus:border-[#4FA3D9]
                    focus:ring-4
                    focus:ring-sky-100
                ">

                        <input maxlength="1" class="
                    otp
                    w-14
                    h-14
                    rounded-2xl
                    border
                    border-slate-200
                    bg-slate-50
                    text-center
                    text-2xl
                    font-black
                    outline-none
                    focus:border-[#4FA3D9]
                    focus:ring-4
                    focus:ring-sky-100
                ">

                        <input maxlength="1" class="
                    otp
                    w-14
                    h-14
                    rounded-2xl
                    border
                    border-slate-200
                    bg-slate-50
                    text-center
                    text-2xl
                    font-black
                    outline-none
                    focus:border-[#4FA3D9]
                    focus:ring-4
                    focus:ring-sky-100
                ">

                        <input maxlength="1" class="
                    otp
                    w-14
                    h-14
                    rounded-2xl
                    border
                    border-slate-200
                    bg-slate-50
                    text-center
                    text-2xl
                    font-black
                    outline-none
                    focus:border-[#4FA3D9]
                    focus:ring-4
                    focus:ring-sky-100
                ">

                    </div>

                    <button id="verifyBtn" class="
                mt-8
                w-full
                h-14
                rounded-2xl
                bg-gradient-to-r
                from-[#4FA3D9]
                to-[#2C6E9B]
                text-white
                font-bold
                shadow-lg
            ">
                        驗證登入
                    </button>

                    <button id="resendBtn" class="
                mt-4
                w-full
                text-[#2C6E9B]
                font-medium
            ">
                        重新發送驗證碼
                    </button>

                </div>

            </div>



        </div>

        <!-- Footer -->

        <div class="
        hidden
                mt-6
                text-center
                text-xs
                text-slate-400
            ">
            SAN-YING GO ADMIN SYSTEM<br>
            僅限管理者與核銷人員使用
        </div>

    </div>

    </div>

    <!-- Success Modal -->

    <div id="successModal" class="
            hidden
            fixed
            inset-0
            z-50
            bg-black/50
            flex
            items-center
            justify-center
            p-5
        ">

        <div class="
            w-full
            max-w-sm
            bg-white
            rounded-[36px]
            p-8
            text-center
        ">

            <div class="
                w-24
                h-24
                rounded-full
                bg-emerald-50
                border
                border-emerald-100
                flex
                items-center
                justify-center
                mx-auto
                text-4xl
                text-emerald-600
            ">
                ✓
            </div>

            <h2 class="
                mt-6
                text-2xl
                font-black
            ">
                操作成功
            </h2>

            <p id="successMessage" class="
                    mt-3
                    text-slate-500
                ">
            </p>

            <button id="successCloseBtn" class="
                    mt-6
                    w-full
                    h-12
                    rounded-2xl
                    bg-[#2C6E9B]
                    text-white
                ">
                確定
            </button>

        </div>

    </div>

    <!-- Error Modal -->

    <div id="errorModal" class="
            hidden
            fixed
            inset-0
            z-50
            bg-black/50
            flex
            items-center
            justify-center
            p-5
        ">

        <div class="
            w-full
            max-w-sm
            bg-white
            rounded-[36px]
            p-8
            text-center
        ">

            <div class="
                w-24
                h-24
                rounded-full
                bg-red-50
                border
                border-red-100
                flex
                items-center
                justify-center
                mx-auto
                text-4xl
                text-red-600
            ">
                ✕
            </div>

            <h2 class="
                mt-6
                text-2xl
                font-black
                text-red-600
            ">
                發生錯誤
            </h2>

            <p id="errorMessage" class="
                    mt-3
                    text-slate-500
                ">
            </p>

            <button id="errorCloseBtn" class="
                    mt-6
                    w-full
                    h-12
                    rounded-2xl
                    bg-red-500
                    text-white
                ">
                關閉
            </button>

        </div>

    </div>

    <script type="module" src="../../assets/js/admin-login.js">
    </script>

</body>

</html>
